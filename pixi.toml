[workspace]
name = "re3-head-tracking"
version = "0.0.0"
description = "Head tracking mod for Resident Evil 3 Remake via REFramework"
license = "MIT"
channels = ["conda-forge"]
platforms = ["win-64"]

[tasks]
update-submodule = "git submodule update --remote cameraunlock-core && powershell -NoProfile -ExecutionPolicy Bypass -File cameraunlock-core/scripts/update-submodule.ps1"
# Update the cameraunlock-core submodule to its remote tip.
sync = { cmd = "git submodule update --init --remote cameraunlock-core" }

# Generate the CMake build tree (x64 Visual Studio 2022).
# No -G: let CMake auto-detect the installed Visual Studio generator. Pinning
# "Visual Studio 17 2022" broke on CI once the windows runner image moved to
# VS 2026 (VS 17 absent); auto-detect picks whatever VS the machine has.
setup = { cmd = """
    powershell -Command "if (-not (Test-Path 'build')) { cmake -B build -A x64 } else { Write-Host 'Build directory exists, skipping setup' -ForegroundColor Yellow }"
""" }

# Bump vendored mod-loader copies under vendor/ to latest upstream within
# their pinned version range. Manual; commit the result. CI does not run this,
# and build/package/release must not depend on it (deterministic offline builds).
update-deps = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/update-deps.ps1" }

# Build debug configuration.
build-debug = { cmd = "cmake --build build --config Debug", depends-on = ["setup"] }

# Build release configuration. The shippable binary task.
build = { cmd = "cmake --build build --config Release", depends-on = ["setup"] }

# Build and run every host-side test (core camera math, core's GUI-name dedup,
# the config tests and the config differential test) in build-tests/, so build/
# stays the plugin's alone. run-tests.ps1 stops at a failed configure or build,
# so ctest never runs a stale binary.
test = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-tests.ps1"
build-tests = "powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-tests.ps1 -BuildOnly"

# Rewrite the committed HeadTracking.ini, the canonical table's fresh render, after a change to a
# row, a comment or a default, then the config descriptor's per_game in launcher-manifest.json
# from it. The config tests fail until it has run.
render-config = { cmd = "build-tests/tests/Debug/re3ht_config_tests.exe --render-config HeadTracking.ini && node cameraunlock-core/scripts/encode-seed.mjs", depends-on = ["build-tests"] }

# Deploy debug build to a detected local game install.
deploy = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Debug", depends-on = ["build-debug"] }

# Build release and deploy to a detected local game install.
install = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/deploy.ps1 Release", depends-on = ["build"] }

# Run the mod's user-facing uninstaller (release ZIP entry point) against
# the detected install. cmd /c: pixi runs through bash which mangles %% in
# .cmd for-loops.
uninstall = { cmd = "cmd /c scripts\\uninstall.cmd" }
uninstall-all = { cmd = "cmd /c scripts\\uninstall.cmd /force" }

# Produce both -installer.zip and -nexus.zip in release/.
package = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/package-release.ps1", depends-on = ["build", "test"] }

# Core's manifest validator over the ZIPs package just built: the launcher manifest and its config
# descriptor, and that the Nexus ZIP carries no config.
validate-manifest = { cmd = "node cameraunlock-core/scripts/validate-manifest.mjs", depends-on = ["package"] }

# Clean build artifacts.
clean = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'build-tests') { Remove-Item 'build-tests' -Recurse -Force }; if (Test-Path 'bin') { Remove-Item 'bin' -Recurse -Force }; Write-Host 'Build artifacts cleaned' -ForegroundColor Green"
""" }

# Clean everything including release output.
clean-all = { cmd = """
    powershell -Command "if (Test-Path 'build') { Remove-Item 'build' -Recurse -Force }; if (Test-Path 'build-tests') { Remove-Item 'build-tests' -Recurse -Force }; if (Test-Path 'bin') { Remove-Item 'bin' -Recurse -Force }; if (Test-Path 'release') { Remove-Item 'release' -Recurse -Force }; Write-Host 'All build artifacts cleaned' -ForegroundColor Green"
""" }

# Automated release workflow (version bump + tag + push).
release = { cmd = "powershell -ExecutionPolicy Bypass -File scripts/release.ps1" }

[dependencies]
# The build uses the system CMake and Visual Studio. nodejs runs core's canonical config lint in
# `test`, and core's encode-seed.mjs and validate-manifest.mjs, pinned to the build
# cameraunlock-core's own lock resolved.
nodejs = "==26.5.0"
